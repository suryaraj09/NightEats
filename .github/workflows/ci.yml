name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start local Supabase and apply migrations
        run: npm run db:start
      - name: pgTAP tests (place_order, RLS, coupons)
        run: npm run test:db
      - name: Generated database types are up to date
        run: |
          npm run db:types
          git diff --exit-code src/lib/database.types.ts || (echo "Run 'npm run db:types' and commit the result" && exit 1)
